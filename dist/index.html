      <div class="step"><div class="celebration-stage"><div class="screen-fireworks" aria-hidden="true"><div class="firework-burst fw1"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw2"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw3"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw4"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw5"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw6"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw7"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div class="bouquet" role="img" aria-label="一束鲜花"><div class="flower-head flower-left"></div><div class="flower-head flower-main"></div><div class="flower-head flower-right"></div></div></div><p class="prompt">鲜花先送到，烟花也为你亮起来。</p><button class="comfort-btn">继续收下</button></div>

      <div class="tap-hint" id="hint">点击“是”，安慰就开始啦</div>
      <div class="footer">宋宋的一点点关心 · ✦</div>
      <div class="pixel-progress" aria-label="安慰进度"><i class="active"></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
  <script>
    const steps = [...document.querySelectorAll('.step')];
    const hint = document.getElementById('hint');
    const storyTitle = document.getElementById('storyTitle');
    const stageLabel = document.getElementById('stageLabel');
    const progress = [...document.querySelectorAll('.pixel-progress i')];
    const titles = [
      '朱奕瑄，今天是不是有一点难过？',
      '宋宋先陪你缓一缓',
      '朱朱，给你准备了一份小礼物',
      '花、烟花，还有一份小小心意',
      '朱朱，今天也要对自己温柔一点'
    ];
    let current = 0;
    steps.forEach((step, index) => {
      const button = step.querySelector('button');
      if (!button) return;
      button.addEventListener('click', () => {
        if (index !== current) return;
        if (index === steps.length - 1) {
          button.textContent = '收到就好，慢慢来';
          hint.textContent = '这份安慰一直在这里';
          return;
        }
        step.classList.remove('active');
        current += 1;
        steps[current].classList.add('active');
        storyTitle.textContent = titles[current];
        progress.forEach((item, progressIndex) => item.classList.toggle('active', progressIndex === current));
        progress.forEach((item, progressIndex) => item.classList.toggle('done', progressIndex < current));
        stageLabel.textContent = ['先等一下，有个非常重要的问题','宋宋先陪你缓一缓','给你准备了一点小心意','鲜花和烟花都送给你','今天也要对自己温柔一点'][current];
        hint.textContent = ['点击“是”，安慰就开始啦','拥抱已经送到啦，点击继续','打开礼物，看看里面有什么','花、烟花和礼物都准备好了','安慰送到了，愿你轻松一点'][current];
      });
    });
    document.getElementById('restart').addEventListener('click', () => window.location.reload());
  </script>
</body>
