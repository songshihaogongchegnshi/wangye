<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5f8" />
  <title>朱朱不要生气啦</title>
  <style>
    :root { --pink:#ff6f9f; --deep:#70264f; --soft:#fff5f8; --gold:#ffb946; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; overflow-x:hidden; overflow-y:auto; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--deep); background:radial-gradient(circle at 20% 10%, #fff 0 13%, transparent 14%), linear-gradient(150deg,#fff8fb,#ffeaf2 48%,#fff7df); }
    .wrap { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; position:relative; }
    .glow { position:absolute; width:320px; height:320px; border-radius:50%; background:#ffd4e4; filter:blur(46px); opacity:.7; }
    .card { width:min(100%,420px); padding:32px 26px 30px; border:2px solid rgba(255,111,159,.28); border-radius:32px; text-align:center; background:rgba(255,255,255,.74); box-shadow:0 20px 60px rgba(183,71,117,.18); backdrop-filter:blur(10px); position:relative; z-index:1; }
    .card::before { content:""; position:absolute; inset:8px; border:1px solid rgba(255,184,70,.2); border-radius:25px; pointer-events:none; }
    .badge { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; background:linear-gradient(135deg,#fff1b9,#fff8df); color:#b77b2b; font-size:12px; font-weight:800; letter-spacing:1px; box-shadow:0 5px 14px rgba(255,185,70,.14); }
    .badge::before { content:"✦"; color:#ff9e43; font-size:15px; }
    .mini-note { margin:-3px auto 17px; color:#c27c95; font-size:12px; letter-spacing:.5px; }
    .reveal { opacity:0; transform:translateY(20px) scale(.7); pointer-events:none; }
    .reveal.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; animation:pop .6s cubic-bezier(.2,1.5,.4,1) both; }
    .step { display:none; animation:pop .6s cubic-bezier(.2,1.5,.4,1) both; }
    .step.active { display:block; }
    .comfort-btn { min-width:190px; }
    .final-message { margin:20px auto 4px; padding:20px 14px; border-radius:20px; background:#fff7df; color:#8d5d3a; font-size:18px; line-height:1.9; font-weight:700; }
    .gift-row { display:flex; justify-content:center; align-items:center; gap:20px; margin:16px 0 8px; min-height:108px; }
    .flower-art { width:76px; height:76px; filter:drop-shadow(0 0 12px rgba(255,52,132,.7)); animation:flowerGlow 1.8s ease-in-out infinite; }
    .firework-art { width:84px; height:84px; position:relative; filter:drop-shadow(0 0 10px rgba(255,190,45,.8)); }
    .firework-art i { position:absolute; left:40px; top:6px; width:4px; height:38px; border-radius:99px; transform-origin:50% 36px; background:linear-gradient(#fff,#ffdb45 45%,#ff5d9d); animation:burst 1.45s ease-out infinite; }
    .firework-art i:nth-child(1){transform:rotate(0deg)} .firework-art i:nth-child(2){transform:rotate(45deg);animation-delay:.08s} .firework-art i:nth-child(3){transform:rotate(90deg);animation-delay:.16s} .firework-art i:nth-child(4){transform:rotate(135deg);animation-delay:.24s} .firework-art i:nth-child(5){transform:rotate(180deg);animation-delay:.32s} .firework-art i:nth-child(6){transform:rotate(225deg);animation-delay:.4s} .firework-art i:nth-child(7){transform:rotate(270deg);animation-delay:.48s} .firework-art i:nth-child(8){transform:rotate(315deg);animation-delay:.56s}
    .firework-core { position:absolute; left:34px; top:34px; width:16px; height:16px; border-radius:50%; background:#fff7a8; box-shadow:0 0 16px 6px #ffd35c; animation:core .8s ease-in-out infinite alternate; }
    .gift-art { width:76px; height:62px; position:relative; margin-top:22px; border-radius:8px; background:linear-gradient(135deg,#ff4c8b,#d92b72); box-shadow:0 12px 18px rgba(180,33,93,.28), inset 0 2px 0 rgba(255,255,255,.35); animation:giftBounce 1.8s ease-in-out infinite; }
    .gift-art::before { content:""; position:absolute; left:31px; top:0; width:13px; height:62px; background:linear-gradient(90deg,#ffd35e,#fff0a2,#f9a928); }
    .gift-art::after { content:""; position:absolute; left:28px; top:-16px; width:18px; height:22px; border:7px solid #ffd35e; border-radius:50% 50% 10% 50%; transform:rotate(-28deg); box-shadow:18px 0 0 -2px #ffd35e; }
    .prompt { color:#b75a7a; font-size:16px; font-weight:700; line-height:1.7; margin:8px auto 18px; }
    .sparkles { font-size:24px; letter-spacing:12px; color:var(--gold); margin-bottom:8px; }
    .bear { font-size:72px; line-height:1; margin:4px 0 18px; filter:drop-shadow(0 7px 4px rgba(193,78,115,.16)); }
    h1 { margin:0 auto; max-width:100%; font-size:clamp(24px,7.5vw,34px); line-height:1.35; letter-spacing:0; color:var(--pink); text-shadow:2px 2px 0 #fff; text-wrap:balance; overflow-wrap:anywhere; }
    .sub { margin:16px 0 4px; font-size:18px; font-weight:700; }
    .note { margin:0 auto 24px; max-width:300px; line-height:1.8; font-size:15px; color:#9a5c78; }
    .pill { display:inline-block; margin:4px; padding:7px 13px; border-radius:999px; background:#fff0f5; color:#d05283; font-size:13px; font-weight:700; }
    button { border:0; margin-top:18px; padding:13px 28px; border-radius:999px; color:#fff; background:linear-gradient(135deg,#ff75a4,#ff9e87); font-size:16px; font-weight:800; box-shadow:0 8px 18px rgba(255,111,159,.3); cursor:pointer; }
    button:active { transform:scale(.97); }
    .footer { margin-top:20px; color:#c38a9e; font-size:12px; }
    .tap-hint { margin-top:18px; color:#d87999; font-size:13px; font-weight:700; animation:hint 1.8s ease-in-out infinite; }
    .heart { position:absolute; animation:float 5s ease-in-out infinite; opacity:.72; }
    .h1 { left:7%; top:13%; font-size:25px; } .h2 { right:8%; bottom:15%; font-size:22px; animation-delay:1.4s; } .h3 { left:14%; bottom:23%; font-size:16px; animation-delay:2.2s; } .h4 { right:18%; top:19%; font-size:14px; animation-delay:3s; color:#ffb946; }
    @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-8px) rotate(2deg)} }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-16px) rotate(10deg)} }
    @keyframes pop { 0%{opacity:0; transform:translateY(20px) scale(.7)} 70%{opacity:1; transform:translateY(-5px) scale(1.06)} 100%{opacity:1; transform:translateY(0) scale(1)} }
    @keyframes hint { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes burst { 0%{opacity:0; transform:rotate(var(--angle)) scaleY(.2)} 22%{opacity:1} 68%{opacity:1; transform:rotate(var(--angle)) scaleY(1)} 100%{opacity:0; transform:rotate(var(--angle)) scaleY(1.22)} }
    @keyframes core { from{transform:scale(.8);opacity:.7} to{transform:scale(1.25);opacity:1} }
    @keyframes flowerGlow { 50%{transform:scale(1.08) rotate(4deg)} }
    @keyframes giftBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .celebration-stage { position:relative; min-height:260px; margin:8px -54px 0; display:grid; place-items:center; overflow:visible; }
    .bouquet { position:relative; z-index:30; width:150px; height:190px; margin-top:16px; animation:bouquetRise .9s cubic-bezier(.2,1.4,.4,1) both; }
    .bouquet::before { content:""; position:absolute; left:72px; bottom:0; width:7px; height:118px; border-radius:99px; background:#79a77d; transform:rotate(2deg); box-shadow:-35px 16px 0 -2px #8ab587, 34px 22px 0 -2px #6e9e76; }
    .flower-head { position:absolute; width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 50% 50%,#ffd86f 0 12%,transparent 13%),radial-gradient(circle at 50% 17%,#ef718d 0 22%,transparent 23%),radial-gradient(circle at 83% 38%,#f2879a 0 22%,transparent 23%),radial-gradient(circle at 68% 82%,#e85f86 0 22%,transparent 23%),radial-gradient(circle at 32% 82%,#ef718d 0 22%,transparent 23%),radial-gradient(circle at 17% 38%,#f2879a 0 22%,transparent 23%); filter:drop-shadow(0 8px 10px rgba(190,82,108,.18)); }
    .flower-head::after { content:""; position:absolute; left:10px; bottom:-48px; width:38px; height:24px; border-bottom:8px solid #79a77d; border-radius:50%; transform:rotate(-24deg); }
    .flower-main { left:46px; top:8px; transform:scale(1.2); }
    .flower-left { left:2px; top:52px; transform:scale(.78) rotate(-12deg); }
    .flower-right { right:2px; top:58px; transform:scale(.82) rotate(12deg); }
    .screen-fireworks { position:fixed; inset:0; z-index:20; pointer-events:none; overflow:hidden; background:radial-gradient(circle at 50% 45%,rgba(255,235,190,.18),transparent 42%); }
    .firework-burst { position:absolute; width:14px; height:14px; left:var(--x); top:var(--y); animation:burstIn 2.8s ease-out both; animation-delay:var(--delay); }
    .firework-burst span { position:absolute; left:6px; top:6px; width:4px; height:var(--len,100px); border-radius:99px; transform-origin:50% 0; background:linear-gradient(#fff,#ffe275 30%,#ff719b 82%,transparent); box-shadow:0 0 12px #ffd45c,0 0 22px rgba(255,103,147,.6); animation:sparkFly 2.6s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--delay); }
    .firework-burst span:nth-child(1){--angle:0deg} .firework-burst span:nth-child(2){--angle:30deg} .firework-burst span:nth-child(3){--angle:60deg} .firework-burst span:nth-child(4){--angle:90deg} .firework-burst span:nth-child(5){--angle:120deg} .firework-burst span:nth-child(6){--angle:150deg} .firework-burst span:nth-child(7){--angle:180deg} .firework-burst span:nth-child(8){--angle:210deg} .firework-burst span:nth-child(9){--angle:240deg} .firework-burst span:nth-child(10){--angle:270deg} .firework-burst span:nth-child(11){--angle:300deg} .firework-burst span:nth-child(12){--angle:330deg}
    .firework-burst::after { content:""; position:absolute; inset:1px; border-radius:50%; background:#fff5a5; box-shadow:0 0 20px 8px #ffd45c; animation:coreFlash .7s ease-out both; animation-delay:var(--delay); }
    .fw1{--x:14%;--y:23%;--delay:.05s;--len:70px}.fw2{--x:83%;--y:20%;--delay:.22s;--len:82px}.fw3{--x:28%;--y:69%;--delay:.38s;--len:58px}.fw4{--x:72%;--y:64%;--delay:.5s;--len:66px}.fw5{--x:50%;--y:12%;--delay:.64s;--len:52px}.fw6{--x:92%;--y:52%;--delay:.78s;--len:44px}.fw7{--x:7%;--y:48%;--delay:.9s;--len:45px}
    @keyframes bouquetRise { from{opacity:0;transform:translateY(34px) scale(.7)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes burstIn { from{opacity:0;transform:scale(.1)} 12%{opacity:1} 72%{opacity:.9} to{opacity:0;transform:scale(1.12)} }
    @keyframes sparkFly { 0%{opacity:0;transform:rotate(var(--angle)) scaleY(.06)} 18%{opacity:1} 72%{opacity:.95} 100%{opacity:0;transform:rotate(var(--angle)) scaleY(1.12)} }
    @keyframes coreFlash { 0%{opacity:0;transform:scale(.2)} 30%{opacity:1} 100%{opacity:0;transform:scale(2.2)} }
    @media (prefers-reduced-motion: reduce) { .screen-fireworks *, .bouquet { animation-duration:1ms !important; animation-iteration-count:1 !important; } }
    /* Refined visual system: fewer effects, clearer hierarchy, roomier desktop composition. */
    .glow { width:520px; height:520px; background:#ffe8dc; filter:blur(70px); opacity:.38; }
    .card { width:min(100%,560px); padding:38px 54px 34px; background:#fffdfc; border:1px solid #f0d9dc; box-shadow:0 24px 70px rgba(116,61,76,.13); backdrop-filter:none; }
    .card::before { display:none; }
    .sparkles { margin-bottom:10px; color:#c78678; opacity:.8; }
    .badge { background:#fff4dd; color:#99623b; box-shadow:none; }
    h1 { color:#d9577d; text-shadow:none; }
    .sub, .prompt { color:#793f56; }
    .note { color:#8f586c; }
    .mini-note { color:#9a5c78; }
    .footer { color:#9a5c78; }
    .quiet-btn { margin:12px 0 0 8px; padding:11px 18px; color:#9a5c78; background:#fff4f6; border:1px solid #efcbd4; box-shadow:none; font-size:14px; }
    .backdrop-art { display:none; position:absolute; width:min(92vw,980px); height:auto; opacity:.36; pointer-events:none; }
    .hero-icon { width:88px; height:88px; display:block; margin:0 auto 14px; }
    button { background:linear-gradient(135deg,#e7658b,#db826f); box-shadow:0 8px 18px rgba(191,82,108,.2); }
    button:hover { filter:brightness(1.06); transform:translateY(-2px); }
    button:focus-visible { outline:3px solid rgba(217,87,125,.34); outline-offset:4px; }
    button:active { transform:translateY(0) scale(.98); }
    .tap-hint { display:none; }
    .footer { display:none; }
    .quiet-btn { margin:14px 0 0 12px; padding:8px 4px; color:#9a5c78; background:transparent; border:0; box-shadow:none; font-size:14px; text-decoration:underline; text-underline-offset:3px; }
    .quiet-btn:hover { background:transparent; color:#793f56; filter:none; transform:none; }
    .quiet-btn:focus-visible { outline:2px solid rgba(217,87,125,.34); outline-offset:3px; }
    .heart { opacity:.42; }
    @media (min-width:900px) {
      .wrap { padding:24px; }
      .card { min-height:520px; display:flex; flex-direction:column; justify-content:center; }
      .backdrop-art { display:none; }
    }
    @media (max-width:599px) {
      .wrap { min-height:100dvh; padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
      .card { width:100%; padding:28px 22px 26px; border-radius:28px; }
      h1 { font-size:clamp(23px,8vw,30px); line-height:1.3; }
      .sub { font-size:17px; }
      .prompt { font-size:15px; }
      button { width:min(100%,280px); min-height:48px; padding:12px 18px; line-height:1.35; }
      .celebration-stage { min-height:230px; margin-left:-22px; margin-right:-22px; }
      .bouquet { transform:scale(.86); transform-origin:center bottom; }
      .screen-fireworks { height:100dvh; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="glow"></div><svg class="backdrop-art" viewBox="0 0 980 520" aria-hidden="true"><circle cx="490" cy="260" r="190" fill="#fff4e9"/><path d="M140 390c70-90 125-92 178 0M662 390c52-92 114-92 178 0" fill="none" stroke="#e9b5b5" stroke-width="3" stroke-linecap="round"/><path d="M210 115l9 22 24 2-18 15 6 23-21-12-21 12 6-23-18-15 24-2zM760 98l7 17 19 2-14 12 4 18-16-9-16 9 5-18-15-12 19-2z" fill="#f0c36e"/><circle cx="318" cy="110" r="7" fill="#e882a3"/><circle cx="672" cy="150" r="5" fill="#e882a3"/></svg><div class="heart h1">✦</div><div class="heart h2">○</div><div class="heart h3">·</div><div class="heart h4">✧</div>
    <section class="card" aria-label="宋宋给朱奕瑄的安慰">
      <div class="sparkles">✦ ˚｡⋆</div>
      <h1 id="storyTitle">朱奕瑄，今天是不是有一点难过？</h1>
      <p class="sub">如果难过，就先留在这里一会儿。</p>
      <div class="step active"><p class="prompt">今天是不是有一点难过？</p><button class="comfort-btn">是，我想被安慰一下</button></div>
      <div class="step"><svg class="hero-icon" viewBox="0 0 100 100" aria-label="温柔的拥抱"><circle cx="50" cy="29" r="15" fill="#f2b19e"/><path d="M28 82c2-25 11-37 22-37s20 12 22 37" fill="#e8899f"/><path d="M28 56C9 53 8 74 30 70M72 56c19-3 20 18-2 14" fill="none" stroke="#d66b89" stroke-width="8" stroke-linecap="round"/></svg><p class="prompt">今天辛苦啦，先收下这份拥抱。</p><button class="comfort-btn">收到这份拥抱</button></div>
      <div class="step"><p class="prompt">朱朱，给你准备了一份小礼物。<br>希望它能让你心情轻一点。</p><button class="comfort-btn">打开礼物</button></div>
      <div class="step"><div class="celebration-stage"><div class="screen-fireworks" aria-hidden="true"><div class="firework-burst fw1"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw2"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw3"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw4"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw5"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw6"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="firework-burst fw7"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div class="bouquet" role="img" aria-label="一束鲜花"><div class="flower-head flower-left"></div><div class="flower-head flower-main"></div><div class="flower-head flower-right"></div></div></div><p class="prompt">鲜花先送到，烟花也为你亮起来。</p><button class="comfort-btn">继续收下</button></div>
      <div class="step"><svg class="hero-icon" viewBox="0 0 100 100" aria-label="小熊插画"><circle cx="31" cy="28" r="13" fill="#d89b6e"/><circle cx="69" cy="28" r="13" fill="#d89b6e"/><circle cx="50" cy="45" r="28" fill="#e7b17c"/><ellipse cx="50" cy="74" rx="28" ry="18" fill="#e7b17c"/><circle cx="41" cy="45" r="3" fill="#704d4b"/><circle cx="59" cy="45" r="3" fill="#704d4b"/><path d="M45 55q5 5 10 0" fill="none" stroke="#704d4b" stroke-width="3" stroke-linecap="round"/></svg><div class="final-message">不着急开心，先让自己被好好安慰。<br>难过会过去，慢慢来就好。<br>今天辛苦啦，朱朱。</div><button class="comfort-btn" id="received">我收到啦</button><button class="quiet-btn" id="restart">再看一遍</button></div>
      <div class="tap-hint" id="hint">点击“是”，安慰就开始啦</div>
      <div class="footer">宋宋的一点点关心 · ✦</div>
    </section>
  </main>
  <script>
    const steps = [...document.querySelectorAll('.step')];
    const hint = document.getElementById('hint');
    const storyTitle = document.getElementById('storyTitle');
    const titles = [
      '朱奕瑄，今天是不是有一点难过？',
      '宋宋先陪你缓一缓',
      '朱朱，给你准备了一份小礼物',
      '花、烟花，还有一份小小心意',
      '朱朱，今天也要对自己温柔一点'
    ];
    let current = 0;
    steps.forEach((step, index) => {
      const button = step.querySelector('button');
      if (!button) return;
      button.addEventListener('click', () => {
        if (index !== current) return;
        if (index === steps.length - 1) {
          button.textContent = '收到就好，慢慢来';
          hint.textContent = '这份安慰一直在这里';
          return;
        }
        step.classList.remove('active');
        current += 1;
        steps[current].classList.add('active');
        storyTitle.textContent = titles[current];
        hint.textContent = ['点击“是”，安慰就开始啦','拥抱已经送到啦，点击继续','打开礼物，看看里面有什么','花、烟花和礼物都准备好了','安慰送到了，愿你轻松一点'][current];
      });
    });
    document.getElementById('restart').addEventListener('click', () => window.location.reload());
  </script>
</body>
</html>
