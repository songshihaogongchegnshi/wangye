<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5f8" />
  <title>朱朱不要生气啦</title>
  <style>
    :root { --pink:#ff6f9f; --deep:#70264f; --soft:#fff5f8; --gold:#ffb946; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--deep); background:radial-gradient(circle at 20% 10%, #fff 0 13%, transparent 14%), linear-gradient(150deg,#fff8fb,#ffeaf2 48%,#fff7df); }
    .wrap { min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; }
    .glow { position:absolute; width:320px; height:320px; border-radius:50%; background:#ffd4e4; filter:blur(46px); opacity:.7; }
    .card { width:min(100%,420px); padding:32px 26px 30px; border:2px solid rgba(255,111,159,.28); border-radius:32px; text-align:center; background:rgba(255,255,255,.74); box-shadow:0 20px 60px rgba(183,71,117,.18); backdrop-filter:blur(10px); position:relative; z-index:1; }
    .card::before { content:""; position:absolute; inset:8px; border:1px solid rgba(255,184,70,.2); border-radius:25px; pointer-events:none; }
    .badge { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; background:linear-gradient(135deg,#fff1b9,#fff8df); color:#b77b2b; font-size:12px; font-weight:800; letter-spacing:1px; box-shadow:0 5px 14px rgba(255,185,70,.14); }
    .badge::before { content:"✦"; color:#ff9e43; font-size:15px; }
    .progress { display:flex; align-items:center; justify-content:center; gap:0; margin:18px auto 20px; width:min(100%,285px); }
    .progress-line { height:2px; flex:1; background:#f4dbe4; }
    .progress-dot { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:#fff; border:2px solid #f3cbd8; color:#d59bad; font-size:11px; font-weight:800; transition:.35s; }
    .progress-dot.active { color:#fff; border-color:#ff7da8; background:linear-gradient(135deg,#ff70a0,#ff9d79); box-shadow:0 0 0 5px rgba(255,111,159,.12); transform:scale(1.08); }
    .mini-note { margin:-3px auto 17px; color:#c27c95; font-size:12px; letter-spacing:.5px; }
    .reveal { opacity:0; transform:translateY(20px) scale(.7); pointer-events:none; }
    .reveal.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; animation:pop .6s cubic-bezier(.2,1.5,.4,1) both; }
    .step { display:none; animation:pop .6s cubic-bezier(.2,1.5,.4,1) both; }
    .step.active { display:block; }
    .comfort-btn { min-width:190px; }
    .final-message { margin:20px auto 4px; padding:20px 14px; border-radius:20px; background:#fff7df; color:#8d5d3a; font-size:18px; line-height:1.9; font-weight:700; }
    .gift-row { display:flex; justify-content:center; align-items:center; gap:20px; margin:16px 0 8px; min-height:108px; }
    .flower-art { width:76px; height:76px; filter:drop-shadow(0 0 12px rgba(255,52,132,.7)); animation:flowerGlow 1.8s ease-in-out infinite; }
    .firework-art { width:84px; height:84px; position:relative; filter:drop-shadow(0 0 10px rgba(255,190,45,.8)); }
    .firework-art i { position:absolute; left:40px; top:6px; width:4px; height:38px; border-radius:99px; transform-origin:50% 36px; background:linear-gradient(#fff,#ffdb45 45%,#ff5d9d); animation:burst 1.45s ease-out infinite; }
    .firework-art i:nth-child(1){transform:rotate(0deg)} .firework-art i:nth-child(2){transform:rotate(45deg);animation-delay:.08s} .firework-art i:nth-child(3){transform:rotate(90deg);animation-delay:.16s} .firework-art i:nth-child(4){transform:rotate(135deg);animation-delay:.24s} .firework-art i:nth-child(5){transform:rotate(180deg);animation-delay:.32s} .firework-art i:nth-child(6){transform:rotate(225deg);animation-delay:.4s} .firework-art i:nth-child(7){transform:rotate(270deg);animation-delay:.48s} .firework-art i:nth-child(8){transform:rotate(315deg);animation-delay:.56s}
    .firework-core { position:absolute; left:34px; top:34px; width:16px; height:16px; border-radius:50%; background:#fff7a8; box-shadow:0 0 16px 6px #ffd35c; animation:core .8s ease-in-out infinite alternate; }
    .gift-art { width:76px; height:62px; position:relative; margin-top:22px; border-radius:8px; background:linear-gradient(135deg,#ff4c8b,#d92b72); box-shadow:0 12px 18px rgba(180,33,93,.28), inset 0 2px 0 rgba(255,255,255,.35); animation:giftBounce 1.8s ease-in-out infinite; }
    .gift-art::before { content:""; position:absolute; left:31px; top:0; width:13px; height:62px; background:linear-gradient(90deg,#ffd35e,#fff0a2,#f9a928); }
    .gift-art::after { content:""; position:absolute; left:28px; top:-16px; width:18px; height:22px; border:7px solid #ffd35e; border-radius:50% 50% 10% 50%; transform:rotate(-28deg); box-shadow:18px 0 0 -2px #ffd35e; }
    .prompt { color:#b75a7a; font-size:16px; font-weight:700; line-height:1.7; margin:8px auto 18px; }
    .sparkles { font-size:24px; letter-spacing:12px; color:var(--gold); margin-bottom:8px; }
    .bear { font-size:72px; line-height:1; margin:4px 0 18px; filter:drop-shadow(0 7px 4px rgba(193,78,115,.16)); }
    h1 { margin:0; font-size:34px; line-height:1.25; letter-spacing:1px; color:var(--pink); text-shadow:2px 2px 0 #fff; }
    .sub { margin:16px 0 4px; font-size:18px; font-weight:700; }
    .note { margin:0 auto 24px; max-width:300px; line-height:1.8; font-size:15px; color:#9a5c78; }
    .pill { display:inline-block; margin:4px; padding:7px 13px; border-radius:999px; background:#fff0f5; color:#d05283; font-size:13px; font-weight:700; }
    button { border:0; margin-top:18px; padding:13px 28px; border-radius:999px; color:#fff; background:linear-gradient(135deg,#ff75a4,#ff9e87); font-size:16px; font-weight:800; box-shadow:0 8px 18px rgba(255,111,159,.3); cursor:pointer; }
    button:active { transform:scale(.97); }
    .footer { margin-top:20px; color:#c38a9e; font-size:12px; }
    .tap-hint { margin-top:18px; color:#d87999; font-size:13px; font-weight:700; animation:hint 1.8s ease-in-out infinite; }
    .heart { position:absolute; animation:float 5s ease-in-out infinite; opacity:.72; }
    .h1 { left:7%; top:13%; font-size:25px; } .h2 { right:8%; bottom:15%; font-size:22px; animation-delay:1.4s; } .h3 { left:14%; bottom:23%; font-size:16px; animation-delay:2.2s; } .h4 { right:18%; top:19%; font-size:14px; animation-delay:3s; color:#ffb946; }
    @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-8px) rotate(2deg)} }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-16px) rotate(10deg)} }
    @keyframes pop { 0%{opacity:0; transform:translateY(20px) scale(.7)} 70%{opacity:1; transform:translateY(-5px) scale(1.06)} 100%{opacity:1; transform:translateY(0) scale(1)} }
    @keyframes hint { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes burst { 0%{opacity:0; transform:rotate(var(--angle)) scaleY(.2)} 22%{opacity:1} 68%{opacity:1; transform:rotate(var(--angle)) scaleY(1)} 100%{opacity:0; transform:rotate(var(--angle)) scaleY(1.22)} }
    @keyframes core { from{transform:scale(.8);opacity:.7} to{transform:scale(1.25);opacity:1} }
    @keyframes flowerGlow { 50%{transform:scale(1.08) rotate(4deg)} }
    @keyframes giftBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="glow"></div><div class="heart h1">🌷</div><div class="heart h2">☀️</div><div class="heart h3">✨</div><div class="heart h4">✦</div>
    <section class="card" aria-label="宋宋给朱奕瑄小朋友的安慰">
      <div class="sparkles">✦ ˚｡⋆</div>
      <div class="badge">宋宋的安慰小剧场</div>
      <div class="progress" aria-label="安慰进度"><span class="progress-dot active">1</span><span class="progress-line"></span><span class="progress-dot">2</span><span class="progress-line"></span><span class="progress-dot">3</span><span class="progress-line"></span><span class="progress-dot">4</span><span class="progress-line"></span><span class="progress-dot">5</span></div>
      <h1 id="storyTitle">朱奕瑄小朋友今天是不是难过啦？</h1>
      <p class="sub">如果难过的话，就让宋宋来安慰你一下。</p>
      <div class="mini-note">一份慢慢打开的、不会越界的朋友式安慰</div>
      <div class="step active"><p class="prompt">朱朱小朋友愿意告诉宋宋吗？</p><button class="comfort-btn">是，我有一点难过</button></div>
      <div class="step"><div class="bear">🫂</div><p class="prompt">不要难过哦，宋宋来安慰你。</p><button class="comfort-btn">收到拥抱啦</button></div>
      <div class="step"><p class="prompt">朱朱小朋友，请领取安慰礼物。</p><button class="comfort-btn">请朱朱小朋友领取安慰礼物</button></div>
      <div class="step"><div class="gift-row"><svg class="flower-art" viewBox="0 0 100 100" aria-label="鲜艳的花"><defs><linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2f8a"/><stop offset=".55" stop-color="#ff5a40"/><stop offset="1" stop-color="#ffbf38"/></linearGradient></defs><g fill="url(#petal)"><ellipse cx="50" cy="26" rx="15" ry="28"/><ellipse cx="74" cy="40" rx="15" ry="28" transform="rotate(58 74 40)"/><ellipse cx="68" cy="69" rx="15" ry="28" transform="rotate(122 68 69)"/><ellipse cx="32" cy="69" rx="15" ry="28" transform="rotate(-122 32 69)"/><ellipse cx="26" cy="40" rx="15" ry="28" transform="rotate(-58 26 40)"/></g><circle cx="50" cy="50" r="13" fill="#ffe66d"/><circle cx="50" cy="50" r="6" fill="#ff8b22"/></svg><div class="firework-art" aria-label="正在绽放的烟花"><i style="--angle:0deg"></i><i style="--angle:45deg"></i><i style="--angle:90deg"></i><i style="--angle:135deg"></i><i style="--angle:180deg"></i><i style="--angle:225deg"></i><i style="--angle:270deg"></i><i style="--angle:315deg"></i><b class="firework-core"></b></div><div class="gift-art" aria-label="安慰礼物"></div></div><p class="prompt">鲜花、烟花和礼物，都送给今天需要被安慰的朱朱。</p><button class="comfort-btn">打开安慰礼物</button></div>
      <div class="step"><div class="bear">🧸</div><div class="final-message">不要难过哦，朱朱小朋友。<br>不开心的事情会慢慢过去，<br>宋宋希望你今天可以轻松一点、开心一点。🌷</div></div>
      <div class="tap-hint" id="hint">点击“是”，安慰就开始啦</div>
      <div class="footer">宋宋的一点点关心 · ✦</div>
    </section>
  </main>
  <script>
    const steps = [...document.querySelectorAll('.step')];
    const hint = document.getElementById('hint');
    const storyTitle = document.getElementById('storyTitle');
    const progressDots = [...document.querySelectorAll('.progress-dot')];
    const titles = [
      '朱奕瑄小朋友今天是不是难过啦？',
      '没关系，宋宋来安慰你啦',
      '朱朱小朋友，请领取安慰礼物',
      '花花、烟花和礼物都来陪你啦',
      '不要难过啦，朱朱小朋友！'
    ];
    let current = 0;
    steps.forEach((step, index) => {
      const button = step.querySelector('button');
      if (!button) return;
      button.addEventListener('click', () => {
        if (index !== current) return;
        step.classList.remove('active');
        current += 1;
        steps[current].classList.add('active');
        storyTitle.textContent = titles[current];
        progressDots[current].classList.add('active');
        hint.textContent = ['点击“是”，安慰就开始啦','拥抱已经送到啦，点击继续','请朱朱小朋友领取安慰礼物','花、烟花和礼物都准备好了','安慰礼物送达啦 ☀️'][current];
      });
    });
  </script>
</body>
</html>
